<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
body{min-height:100vh;background:#f5f5f7;color:#1d1d1f;padding-bottom:60px}
.header{background:rgba(255,255,255,.9);position:sticky;top:0;z-index:10;border-bottom:1px solid #e5e5ea;padding:18px 20px;text-align:center}
.header-inner{max-width:900px;margin:auto}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:6px}
.brand img{width:44px;height:44px;border-radius:11px}
.brand h1{font-size:24px}
.tagline{color:#6e6e73;font-size:15px;margin-bottom:14px}
.search-wrap{position:relative;max-width:560px;margin:0 auto}
.search-wrap .mag{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.5}
#search{width:100%;font:inherit;font-size:16px;padding:13px 16px 13px 42px;border-radius:12px;border:1px solid #d2d2d7;background:#eef0f3;outline:none}
#search:focus{background:#fff;border-color:#0071e3;box-shadow:0 0 0 3px rgba(0,113,227,.18)}
.filters{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}
.filters button{font:inherit;font-size:14px;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid #d2d2d7;background:#fff;cursor:pointer}
.filters button.on{background:#0071e3;border-color:#0071e3;color:#fff}
main{max-width:900px;margin:0 auto;padding:28px 20px 0}
.count{color:#6e6e73;font-size:14px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.card{background:#fff;border-radius:20px;padding:20px;display:flex;gap:14px;box-shadow:0 4px 16px rgba(0,0,0,.06)}
.card img{width:72px;height:72px;border-radius:17px;object-fit:cover;flex-shrink:0;background:#eee}
.card h2{font-size:18px;margin-bottom:2px}
.card .sub{color:#6e6e73;font-size:14px;line-height:1.4;margin-bottom:6px}
.badge{display:inline-block;font-size:12px;font-weight:600;background:#eef0f3;color:#424245;border-radius:999px;padding:3px 10px;margin-bottom:10px}
.get{display:inline-block;background:#0071e3;color:#fff;font:inherit;font-size:14px;font-weight:700;padding:8px 20px;border-radius:999px;text-decoration:none}
.get:hover{background:#005bb5}
.empty{background:#fff;border-radius:20px;padding:40px 20px;text-align:center;color:#6e6e73;grid-column:1/-1}
.empty strong{display:block;color:#1d1d1f;font-size:18px;margin-bottom:6px}
footer{text-align:center;margin-top:36px;font-size:13px;color:#6e6e73}
footer a{color:#0071e3;text-decoration:none}
</style>

<header class="header"><div class="header-inner">
<div class="brand"><img src="assets/optimized/logoCeltmen.png" alt="Celtmen Apps" width="44" height="44"><h1>Celtmen Apps</h1></div>
<p class="tagline">Recherchez et téléchargez toutes nos applications</p>
<div class="search-wrap"><span class="mag">🔍</span><input id="search" type="search" autocomplete="off" placeholder="Rechercher une app..." aria-label="Rechercher une application"></div>
<div class="filters" id="filters"><button data-cat="all" class="on">Toutes</button><button data-cat="games">Jeux</button><button data-cat="entertainment">Divertissement</button></div>
</div></header>
<main><p class="count" id="count"></p><div class="grid" id="apps"></div>

</main>
<script src="apps-data.js"></script>
<script src="store-home.js"></script>
