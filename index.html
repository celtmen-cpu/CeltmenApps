    min-height:100vh;
    background:#f5f5f7;

    display:flex;

    align-items:center;

}


.container{

    background:white;

    max-width:600px;

    padding:60px 40px;

    border-radius:32px;

    text-align:center;

    box-shadow:0 20px 50px rgba(0,0,0,.08);

.logo{

}


h1{

    font-size:48px;

    margin-bottom:20px;

}

    color:#666;

    font-size:18px;

    line-height:1.5;

    margin-bottom:35px;

}


.button{

    display:inline-block;

    background:#0071e3;

    color:white;

    text-decoration:none;

    padding:15px 35px;

    border-radius:999px;

    font-weight:600;

    transition:.25s;

}


.button:hover{

    background:#005bb5;

    transform:scale(1.05);

}


@media(max-width:600px){

.container{

    margin:20px;

    padding:40px 25px;

    font-size:38px;
