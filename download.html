<!DOCTYPE html>
<html lang="fr-FR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title id="metaTitle">Telechargement</title>
<meta name="description" content="Telechargez nos apps gratuitement sur Android, iOS, Windows et Mac.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0D0081">
<link rel="icon" href="assets/optimized/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="assets/optimized/logoCeltmen.png">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}
body{min-height:100vh;background:#f5f5f7;color:#1d1d1f;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px}
.download{width:100%;max-width:640px;background:#fff;border-radius:32px;padding:45px 35px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.08)}
.download .logo{width:110px;height:110px;border-radius:26px;margin-bottom:22px;object-fit:cover;background:#eee}
.download h1{font-size:34px;margin-bottom:12px}
.download .note{color:#6e6e73;font-size:17px;line-height:1.5;margin-bottom:12px}
.download .version{display:inline-block;background:#f0f0f3;color:#424245;font-size:13px;font-weight:600;border-radius:999px;padding:6px 14px;margin-bottom:28px}
.platforms{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}
.platforms button{display:flex;align-items:center;justify-content:center;gap:10px;font:inherit;font-size:16px;font-weight:600;color:#fff;background:#0D0081;border:0;border-radius:16px;padding:16px 18px;cursor:pointer}
.platforms button:hover{background:#1a00b3}
.platforms button.todo{background:#8e8e93;opacity:.7;cursor:not-allowed}
.platforms .icon{font-size:20px}
.help{margin-top:26px;color:#6e6e73;font-size:14px}
.help a{color:#0071e3;text-decoration:none}
.back-link{display:inline-block;margin-bottom:18px;color:#0071e3;text-decoration:none;font-size:15px}
@media(max-width:600px){.platforms{grid-template-columns:1fr}.download{padding:35px 22px}.download h1{font-size:28px}}
</style>
</head>
<body>
<a class="back-link" href="index.html">Retour au Store</a>
<div class="download">
<img class="logo" id="appLogo" src="assets/optimized/logoCeltmen.png" alt="App" width="110" height="110">
<h1 id="appTitle">Telechargement</h1>
<p class="note" id="appNote">Choisissez votre plateforme pour installer l'app gratuitement.</p>
<p class="version" id="appVer">Version 1</p>
<div class="platforms">
<button type="button" id="btnAndroid"><span class="icon">🤖</span><span>Android</span></button>
<button type="button" id="btnIos"><span class="icon">🍎</span><span>iOS</span></button>
<button type="button" id="btnWin"><span class="icon">🪟</span><span>Windows</span></button>
<button type="button" id="btnMac"><span class="icon">💻</span><span>Mac</span></button>
</div>
<p class="help"><a href="telechargement.html">Toutes les apps</a> - <a href="index.html">Store</a></p>
</div>
<script src="download-data.js"></script>
<script src="download.js"></script>
</body>
</html>
