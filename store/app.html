<!DOCTYPE html>
<html lang="fr-FR" class="i18n-pending">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Celtmen Apps</title>

<meta name="description" data-i18n-content="meta.appDesc" content="Fiche détaillée d'une application du store Celtmen Apps.">
<meta name="robots" content="index, follow">
<meta name="theme-color" content="#0071e3">

<link rel="canonical" href="https://celtmen-apps.pages.dev/store/app.html">

<!-- Favicon : image locale du même site -->
<link rel="icon" href="../assets/optimized/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="../assets/optimized/logoCeltmen.png">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="app-page.css">

<style>

/* La fiche dynamique n'affiche que 3 informations (âge, taille, version) :
   tout le reste du style est partagé avec les pages dédiées (app-page.css). */

.info-grid{

grid-template-columns:repeat(3,1fr);

}

.hero h1{

font-size:40px;

}

.hero .button{

display:inline-block;
padding:13px 30px;
font-weight:bold;

}

html.i18n-pending body{

visibility:hidden;

}

@media(max-width:700px){

.info-grid{

grid-template-columns:1fr;

}

}

</style>

<!-- Traductions : la langue de l'utilisateur est chargée automatiquement -->
<script src="../i18n.js" defer onerror="document.documentElement.classList.remove('i18n-pending')"></script>
<script src="apps.js" defer></script>
<script src="app.js" defer></script>

<noscript><style>html.i18n-pending body{visibility:visible}</style></noscript>

</head>


<body>


<div class="page" id="app">

</div>


</body>

</html>
